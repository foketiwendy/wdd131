<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Product Review Form">
    <meta name="author" content="Stellina Wendy Foketi">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating">
                    <label for="rating1">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        ☆
                    </label>

                    <label for="rating2">
                        <input type="radio" id="rating2" name="rating" value="2">
                        ☆☆
                    </label>

                    <label for="rating3">
                        <input type="radio" id="rating3" name="rating" value="3">
                        ☆☆☆
                    </label>

                    <label for="rating4">
                        <input type="radio" id="rating4" name="rating" value="4">
                        ☆☆☆☆
                    </label>

                    <label for="rating5">
                        <input type="radio" id="rating5" name="rating" value="5">
                        ☆☆☆☆☆
                    </label>
                </div>
            </fieldset>

            <label for="installationDate">Date of Installation</label>
            <input
                type="date"
                id="installationDate"
                name="installationDate"
                required
            >

            <fieldset>
                <legend>Useful Features</legend>

                <label for="feature1">
                    <input
                        type="checkbox"
                        id="feature1"
                        name="features"
                        value="easy-to-use"
                    >
                    Easy to Use
                </label>

                <label for="feature2">
                    <input
                        type="checkbox"
                        id="feature2"
                        name="features"
                        value="durable"
                    >
                    Durable
                </label>

                <label for="feature3">
                    <input
                        type="checkbox"
                        id="feature3"
                        name="features"
                        value="good-performance"
                    >
                    Good Performance
                </label>

                <label for="feature4">
                    <input
                        type="checkbox"
                        id="feature4"
                        name="features"
                        value="good-value"
                    >
                    Good Value
                </label>
            </fieldset>

            <label for="writtenReview">Written Review</label>
            <textarea
                id="writtenReview"
                name="writtenReview"
                rows="6"
                placeholder="Write your review here..."
            ></textarea>

            <label for="userName">Your Name</label>
            <input
                type="text"
                id="userName"
                name="userName"
                placeholder="Enter your name"
            >

            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Stellina Wendy Foketi | Tonga
        </p>

        <p>
            Last Modified:
            <span id="lastModified"></span>
        </p>
    </footer>

</body>
</html>
