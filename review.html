<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review submission confirmation showing the number of product reviews completed.">
    <meta name="author" content="Stellina Wendy Foketi">
    <title>Product Review Confirmation</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/review.js" defer></script>
</head>

<body>
    <header>
        <h1>Review Submitted</h1>
    </header>

    <main class="confirmation">
        <h2>Thank You!</h2>

        <p>
            Your product review has been submitted successfully.
        </p>

        <p>
            You have completed
            <strong id="reviewCounter">0</strong>
            review(s).
        </p>

        <a href="form.html" class="back-button">
            Write Another Review
        </a>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Stellina Wendy Foketi | Tonga</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
